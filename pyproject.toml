[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-prop-protocol"
version = "0.2.0"
description = "Portable, verifiable prop reference packages for creative studios"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=41"]
images = ["Pillow>=10"]
dev = ["pytest>=8", "cryptography>=41", "Pillow>=10"]

[project.scripts]
opp = "opp.core:main"

[project.urls]
Homepage = "https://github.com/hodgemann/opp"
Repository = "https://github.com/hodgemann/opp"

[tool.setuptools.packages.find]
include = ["opp*"]
